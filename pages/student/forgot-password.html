<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | ICT with Harsha</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><section class="auth-story"><a class="auth-logo" href="index.html"><b>H/</b><span>ICT with Harsha</span></a><div class="story-art"><img src="assets/harsha-profile.jpg" alt="Your ICT teacher"><span class="shape s1">RESET</span><span class="shape s2">ICT</span></div><div><h2>Return to learning.</h2><p>Verify your registered student email and securely choose a new password.</p></div></section><section class="auth-form"><div class="form-wrap"><span class="eyebrow">STUDENT ACCOUNT RECOVERY</span><h1>Reset your password.</h1><p class="intro">We will email a six-digit verification code to your registered address.</p><section id="forgot-request"><form id="forgot-form"><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="Enter your registered email"></label><button class="submit" type="submit">Send verification code →</button></form></section><section id="forgot-reset" hidden><form id="reset-form"><label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter the 6-digit code"></label><label>New password <small>At least 8 characters</small><div class="password"><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Enter your new password"><button class="eye" type="button" aria-label="Show password">◉</button></div></label><label>Confirm new password<div class="password"><input name="confirm_password" type="password" minlength="8" required autocomplete="new-password" placeholder="Enter the same password again"><button class="eye" type="button" aria-label="Show password">◉</button></div></label><button class="submit" type="submit">Verify & update password →</button></form></section><p id="auth-message" aria-live="polite"></p><p class="switch"><a href="student-login.html">← Return to student login</a></p></div></section></main><script src="auth.js"></script></body></html>
