<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student registration | ICT with Harsha</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><section class="auth-story"><a class="auth-logo" href="index.html"><b>H/</b><span>ICT with Harsha</span></a><div class="story-art"><img src="assets/harsha-profile.jpg" alt="Harsha Madushan"><span class="shape s1">JOIN</span><span class="shape s2">ICT</span></div><div><h2>Start learning.</h2><p>Create your student account to access classes, resources, announcements and progress.</p></div></section><section class="auth-form"><div class="form-wrap"><span class="eyebrow">STUDENT REGISTRATION</span><h1>Create your account.</h1><p class="intro">Registration creates a student account. Admin access cannot be created here.</p><form id="register-form"><label>Full name<input name="name" required placeholder="Your full name"></label><label>Email address<input name="email" type="email" required placeholder="email@example.com"></label><label>Phone number<input name="phone" required placeholder="07X XXX XXXX"></label><label>Password <small>At least 8 characters</small><div class="password"><input name="password" type="password" required minlength="8"><button class="eye" type="button">◉</button></div></label><button class="submit" type="submit">Create student account →</button><p id="auth-message"></p></form><p class="switch">Already registered? <a href="login.html">Log in</a></p></div></section></main><script src="auth.js"></script></body></html>
